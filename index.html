<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>ULVT - 上肢リハビリ支援</title>

  <style>
    body {
      font-family: sans-serif;
      background: #f0f4f4;
      margin: 0;
      padding: 20px;
    }

    .app {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 15px;
    }

    h1 {
      color: #147d70;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    select {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin: 10px 0 20px;
    }

    .camera {
      background: #233b3b;
      color: white;
      height: 250px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .records {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .record {
      flex: 1;
      background: #eef5f3;
      padding: 15px;
      text-align: center;
      border-radius: 10px;
    }

    .record strong {
      display: block;
      font-size: 25px;
      margin-top: 8px;
    }

    .buttons {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 16px;
      font-size: 17px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .start {
      background: #147d70;
      color: white;
    }

    .stop {
      background: #e2e7e7;
      color: #333;
    }

    .note {
      color: #666;
      font-size: 13px;
      margin-top: 20px;
    }
    

.camera {
  overflow: hidden;
}

#cameraVideo {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.camera-buttons {
  margin-top: 12px;
}

#cameraStatus {
  font-size: 14px;
  color: #555;
  margin-top: 10px;
}

#recordedVideo {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* モデル動画の左右反転 */
.mirrored {
  transform: scaleX(-1);
}

/* 撮影できないときのボタン */
button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

#recordingStatus {
  color: #555;
  font-size: 14px;
  margin-top: 10px;
}

/* 重ね合わせ画面 */
.overlay-container {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3;
  background: #233b3b;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 20px;
}

/* 2つの映像を同じ位置に配置 */
.overlay-container video {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* リアルタイム映像 */
#liveOverlayVideo {
  z-index: 1;
}

/* モデル動画 */
#modelOverlayVideo {
  z-index: 2;
  transform: scaleX(-1);
  opacity: 0.5;
  pointer-events: none;
}

/* 透過度調整 */
.opacity-control {
  background: #eef5f3;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
}

.opacity-control label {
  display: block;
  margin-bottom: 10px;
}

#opacitySlider {
  width: 80%;
  accent-color: #147d70;
}

#opacityValue {
  font-weight: bold;
  margin-left: 8px;
}

#overlayStatus {
  color: #555;
  font-size: 14px;
  margin-top: 10px;
}

/* モデル動画の調整パネル */
.adjust-panel {
  background: #eef5f3;
  padding: 20px;
  border-radius: 10px;
  margin-top: 15px;
  margin-bottom: 20px;
}

/* 各項目の名前 */
.adjust-panel label {
  display: block;
  margin-top: 15px;
  margin-bottom: 8px;
  font-weight: bold;
}

/* 調整スライダー */
.adjust-panel input[type="range"] {
  width: 100%;
  accent-color: #147d70;
  cursor: pointer;
}

/* 再生速度の選択 */
.adjust-panel select {
  width: 100%;
  margin: 5px 0 10px;
}

/* リセットボタン */
#resetAdjust {
  width: 100%;
  margin-top: 20px;
}

/* 運動回数の操作 */
.count-controls {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

.count-controls button {
  flex: 1;
  font-size: 20px;
}

/* 記録保存ボタン */
.record-actions {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

/* 練習状態 */
#trainingStatus {
  color: #147d70;
  font-weight: bold;
  margin-top: 12px;
}

/* 練習履歴 */
.history-table-wrap {
  width: 100%;
  overflow-x: auto;
}

.history-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

.history-table th,
.history-table td {
  border: 1px solid #ddd;
  padding: 10px;
  text-align: center;
}

.history-table th {
  background: #eef5f3;
}

.history-table tbody tr:nth-child(even) {
  background: #f7f9f9;
}
</style>
</head>

<body>

<div class="camera">

    <p class="note">
      ※ 現在は画面確認用の試作品です。
      カメラ・記録機能は次の工程で追加します。
    </p>

  </main>



<script>
  const video = document.getElementById("cameraVideo");
  const startButton = document.getElementById("startCamera");
  const stopButton = document.getElementById("stopCamera");
  const statusText = document.getElementById("cameraStatus");

  let cameraStream = null;

  // カメラを開始する
  async function startCamera() {
    try {
      if (cameraStream) {
        return;
      }

      if (!navigator.mediaDevices?.getUserMedia) {
        statusText.textContent =
          "この環境ではカメラを使用できません。";
        return;
      }

      statusText.textContent = "カメラを起動しています...";

      startButton.disabled = true;

      const stream =
        await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

      cameraStream = stream;
      video.srcObject = stream;

      await video.play();

      statusText.textContent = "カメラ起動中";

    } catch (error) {
      console.error(error);

      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }

      video.srcObject = null;

      statusText.textContent =
        "カメラを起動できませんでした。権限や接続を確認してください。";

    } finally {
      startButton.disabled = false;
    }
  }

  // カメラを停止する
  function stopCamera() {
    if (cameraStream) {
      cameraStream.getTracks().forEach(track => track.stop());
      cameraStream = null;
    }

    video.pause();
    video.srcObject = null;

    statusText.textContent = "カメラは停止しています";
  }

  startButton.addEventListener("click", startCamera);
  stopButton.addEventListener("click", stopCamera);

  window.addEventListener("pagehide", stopCamera);
</script>

<script>
  // 撮影用の操作部品
  const startRecButton =
    document.getElementById("startRecording");

  const stopRecButton =
    document.getElementById("stopRecording");

  const flipButton =
    document.getElementById("flipButton");

  const recordedVideo =
    document.getElementById("recordedVideo");

  const recordingStatus =
    document.getElementById("recordingStatus");

  let mediaRecorder = null;
  let recordedChunks = [];
  let recordedUrl = null;
  let isMirrored = true;

  stopRecButton.disabled = true;
  recordedVideo.classList.add("mirrored");

  // 撮影開始
  function startRecording() {

    if (!cameraStream) {
      recordingStatus.textContent =
        "先にカメラを開始してください。";
      return;
    }

    if (!window.MediaRecorder) {
      recordingStatus.textContent =
        "このブラウザは動画撮影に対応していません。";
      return;
    }

    if (mediaRecorder &&
        mediaRecorder.state !== "inactive") {
      return;
    }

    recordedChunks = [];

    // ブラウザが対応する動画形式を選択
    const formats = [
      "video/webm;codecs=vp8",
      "video/webm",
      "video/mp4"
    ];

    const mimeType = formats.find(type =>
      MediaRecorder.isTypeSupported(type)
    );

    try {
      mediaRecorder = mimeType
        ? new MediaRecorder(cameraStream, {
            mimeType: mimeType
          })
        : new MediaRecorder(cameraStream);

      mediaRecorder.ondataavailable = event => {
        if (event.data.size > 0) {
          recordedChunks.push(event.data);
        }
      };

      mediaRecorder.onstop = () => {

        if (recordedChunks.length === 0) {
          recordingStatus.textContent =
            "動画データを取得できませんでした。";
          return;
        }

        const blob = new Blob(recordedChunks, {
          type: mediaRecorder.mimeType ||
                recordedChunks[0].type
        });

        // 前の動画データを解放
        recordedVideo.pause();
        recordedVideo.removeAttribute("src");
        recordedVideo.load();

        if (recordedUrl) {
          URL.revokeObjectURL(recordedUrl);
        }

        recordedUrl = URL.createObjectURL(blob);

        recordedVideo.src = recordedUrl;
        recordedVideo.load();

        recordingStatus.textContent =
          "撮影完了。動画を再生できます。";
      };

      mediaRecorder.onerror = () => {
        recordingStatus.textContent =
          "撮影中にエラーが発生しました。";
        stopRecButton.disabled = true;
        startRecButton.disabled = false;
      };

      mediaRecorder.start();

      startRecButton.disabled = true;
      stopRecButton.disabled = false;

      recordingStatus.textContent =
        "撮影中です...";

    } catch (error) {
      console.error(error);

      recordingStatus.textContent =
        "撮影を開始できませんでした。";

      startRecButton.disabled = false;
      stopRecButton.disabled = true;
    }
  }

  // 撮影停止
  function stopRecording() {

    if (mediaRecorder &&
        mediaRecorder.state === "recording") {
      mediaRecorder.stop();
    }

    stopRecButton.disabled = true;
    startRecButton.disabled = false;
  }

  // 左右反転の切り替え
  function toggleFlip() {

    isMirrored = !isMirrored;

    recordedVideo.classList.toggle(
      "mirrored",
      isMirrored
    );

    flipButton.textContent = isMirrored
      ? "左右反転 ON"
      : "左右反転 OFF";
  }

  // ボタンと機能を接続
  startRecButton.addEventListener(
    "click", startRecording
  );

  stopRecButton.addEventListener(
    "click", stopRecording
  );

  flipButton.addEventListener(
    "click", toggleFlip
  );

  // カメラ停止時は撮影も終了
  stopButton.addEventListener("click", () => {
    stopRecording();
  });

  // ページを閉じる際の後処理
  window.addEventListener("pagehide", () => {
    stopRecording();

    if (recordedUrl) {
      URL.revokeObjectURL(recordedUrl);
    }
  });
</script>

<script>
  // 重ね合わせ用の画面部品
  const liveOverlayVideo =
    document.getElementById("liveOverlayVideo");

  const modelOverlayVideo =
    document.getElementById("modelOverlayVideo");

  const opacitySlider =
    document.getElementById("opacitySlider");

  const opacityValue =
    document.getElementById("opacityValue");

  const startOverlayButton =
    document.getElementById("startOverlay");

  const stopOverlayButton =
    document.getElementById("stopOverlay");

  const overlayStatus =
    document.getElementById("overlayStatus");

  let overlayRunning = false;

  // 初期状態
  stopOverlayButton.disabled = true;

  // 透過度を変更する
  opacitySlider.addEventListener("input", () => {

    const opacity = Number(opacitySlider.value);

    modelOverlayVideo.style.opacity = opacity / 100;

    opacityValue.textContent = opacity + "%";
  });

  // 重ね合わせを開始
  async function startOverlayTraining() {

    if (overlayRunning) {
      return;
    }

    // カメラが起動しているか確認
    if (!cameraStream ||
        !cameraStream.active) {

      overlayStatus.textContent =
        "先にカメラを開始してください。";

      return;
    }

    // 撮影した動画があるか確認
    if (!recordedUrl) {

      overlayStatus.textContent =
        "先にモデル動画を撮影してください。";

      return;
    }

    startOverlayButton.disabled = true;

    try {

      // リアルタイム映像を表示
      liveOverlayVideo.srcObject = cameraStream;

      // 撮影したモデル動画を読み込む
      modelOverlayVideo.src = recordedUrl;

      // 第4回の反転設定と同期

      // スライダーの設定を反映
      modelOverlayVideo.style.opacity =
        Number(opacitySlider.value) / 100;

      // 2つの映像を再生
      await liveOverlayVideo.play();
modelOverlayVideo.playbackRate =
  Number(speedControl.value);
updateModelTransform();
      await modelOverlayVideo.play();
      overlayRunning = true;

      stopOverlayButton.disabled = false;

      overlayStatus.textContent =
        "重ね合わせトレーニング中";

    } catch (error) {

      console.error(error);

      liveOverlayVideo.pause();
      modelOverlayVideo.pause();

      liveOverlayVideo.srcObject = null;
      modelOverlayVideo.removeAttribute("src");
      modelOverlayVideo.load();

      overlayStatus.textContent =
        "重ね合わせを開始できませんでした。";

      startOverlayButton.disabled = false;
    }
  }

  // 重ね合わせを停止
  function stopOverlayTraining() {

    overlayRunning = false;

    liveOverlayVideo.pause();
    modelOverlayVideo.pause();

    liveOverlayVideo.srcObject = null;

    modelOverlayVideo.removeAttribute("src");
    modelOverlayVideo.load();

    startOverlayButton.disabled = false;
    stopOverlayButton.disabled = true;

    overlayStatus.textContent =
      "トレーニングを停止しました。";
  }

  // 操作ボタンと接続
  startOverlayButton.addEventListener(
    "click",
    startOverlayTraining
  );

  stopOverlayButton.addEventListener(
    "click",
    stopOverlayTraining
  );

  // カメラを停止した場合も重ね合わせを終了
  stopButton.addEventListener(
    "click",
    stopOverlayTraining
  );

  // 新しいモデル動画の撮影を始めたら重畳を終了
  startRecButton.addEventListener(
    "click",
    stopOverlayTraining
  );

  window.addEventListener(
    "pagehide",
    stopOverlayTraining
  );
</script>

<script>
  // 調整用の操作部品を取得
  const speedControl =
    document.getElementById("speedControl");

  const positionX =
    document.getElementById("positionX");

  const positionY =
    document.getElementById("positionY");

  const scaleControl =
    document.getElementById("scaleControl");

  const positionXValue =
    document.getElementById("positionXValue");

  const positionYValue =
    document.getElementById("positionYValue");

  const scaleValue =
    document.getElementById("scaleValue");

  const resetAdjust =
    document.getElementById("resetAdjust");

  // 現在の調整値
  let modelX = 0;
  let modelY = 0;
  let modelScale = 1;

  // 位置・大きさ・左右反転を反映
  function updateModelTransform() {

    const flip = isMirrored ? -1 : 1;

    modelOverlayVideo.style.transform =
      `translate(${modelX}px, ${modelY}px)
       scale(${flip * modelScale}, ${modelScale})`;
  }

  // 再生速度を変更
  speedControl.addEventListener("change", () => {

    const speed = Number(speedControl.value);

    modelOverlayVideo.playbackRate = speed;

  });

  // 左右位置を変更
  positionX.addEventListener("input", () => {

    modelX = Number(positionX.value);

    positionXValue.textContent =
      modelX + "px";

    updateModelTransform();

  });

  // 上下位置を変更
  positionY.addEventListener("input", () => {

    modelY = Number(positionY.value);

    positionYValue.textContent =
      modelY + "px";

    updateModelTransform();

  });

  // 拡大・縮小
  scaleControl.addEventListener("input", () => {

    modelScale =
      Number(scaleControl.value) / 100;

    scaleValue.textContent =
      scaleControl.value + "%";

    updateModelTransform();

  });

  // 調整値を初期状態に戻す
  resetAdjust.addEventListener("click", () => {

    modelX = 0;
    modelY = 0;
    modelScale = 1;

    positionX.value = 0;
    positionY.value = 0;
    scaleControl.value = 100;

    speedControl.value = 1;

    positionXValue.textContent = "0px";
    positionYValue.textContent = "0px";
    scaleValue.textContent = "100%";

    modelOverlayVideo.playbackRate = 1;

    updateModelTransform();

  });

  // 重ね合わせ開始時にも設定を反映
  startOverlayButton.addEventListener(
    "click",
    () => {

      modelOverlayVideo.playbackRate =
        Number(speedControl.value);

      updateModelTransform();

    }
  );

  // 初期設定を反映
  updateModelTransform();
</script>

<script>
  // 練習記録に使用する画面部品
  const startTrainingButton =
    document.getElementById("startTraining");

  const stopTrainingButton =
    document.getElementById("stopTraining");

  const addCountButton =
    document.getElementById("addCount");

  const subtractCountButton =
    document.getElementById("subtractCount");

  const saveTrainingButton =
    document.getElementById("saveTraining");

  const exportCSVButton =
    document.getElementById("exportCSV");

  const timerDisplay =
    document.getElementById("timer");

  const countDisplay =
    document.getElementById("count");

  const trainingStatus =
    document.getElementById("trainingStatus");

  const exerciseSelect =
    document.getElementById("exercise");

  const historyBody =
    document.getElementById("trainingHistory");

  // 練習状態を管理
  let trainingRunning = false;
  let trainingStartedAt = null;
  let trainingEndedAt = null;

  let trainingStartTime = 0;
  let elapsedMilliseconds = 0;
  let timerInterval = null;

  let exerciseCount = 0;
  let lastSaved = false;

  const STORAGE_KEY = "ulvt-training-history-v1";

  // 時間を「分:秒」に変換
  function formatTime(milliseconds) {
    const totalSeconds =
      Math.floor(milliseconds / 1000);

    const minutes =
      Math.floor(totalSeconds / 60);

    const seconds =
      totalSeconds % 60;

    return (
      String(minutes).padStart(2, "0") +
      ":" +
      String(seconds).padStart(2, "0")
    );
  }

  // 現在の練習時間を取得
  function getElapsedTime() {
    if (trainingRunning) {
      return Math.max(
        0,
        performance.now() - trainingStartTime
      );
    }

    return elapsedMilliseconds;
  }

  // 練習時間の表示を更新
  function updateTimer() {
    timerDisplay.textContent =
      formatTime(getElapsedTime());
  }

  // 回数表示を更新
  function updateCount() {
    countDisplay.textContent =
      exerciseCount + "回";
  }

  // ボタンの状態を更新
  function updateTrainingButtons() {
    startTrainingButton.disabled = trainingRunning;
    stopTrainingButton.disabled = !trainingRunning;

    addCountButton.disabled = !trainingRunning;
    subtractCountButton.disabled = !trainingRunning;

    saveTrainingButton.disabled =
      trainingRunning ||
      trainingStartedAt === null ||
      lastSaved;
  }

  // 練習開始
  function startTraining() {
    if (trainingRunning) return;

    clearInterval(timerInterval);

    trainingRunning = true;
    trainingStartedAt = new Date();
    trainingEndedAt = null;

    trainingStartTime = performance.now();
    elapsedMilliseconds = 0;

    exerciseCount = 0;
    lastSaved = false;

    updateTimer();
    updateCount();
    updateTrainingButtons();

    trainingStatus.textContent =
      "練習中です";

    timerInterval = setInterval(updateTimer, 250);
  }

  // 練習終了
  function stopTraining() {
    if (!trainingRunning) return;

    elapsedMilliseconds = getElapsedTime();

    trainingRunning = false;
    trainingEndedAt = new Date();

    clearInterval(timerInterval);
    timerInterval = null;

    updateTimer();
    updateTrainingButtons();

    trainingStatus.textContent =
      "練習終了。結果を保存できます。";
  }

  // 運動回数を1回追加
  function addCount() {
    if (!trainingRunning) return;

    exerciseCount++;
    updateCount();
  }

  // 運動回数を1回減らす
  function subtractCount() {
    if (!trainingRunning) return;

    exerciseCount =
      Math.max(0, exerciseCount - 1);

    updateCount();
  }

  // 保存済みの練習履歴を取得
  function getHistory() {
    try {
      const data =
        localStorage.getItem(STORAGE_KEY);

      const parsed = data ? JSON.parse(data) : [];

      return Array.isArray(parsed) ? parsed : [];

    } catch (error) {
      console.error(error);
      return [];
    }
  }

  // 履歴を画面に表示
  function showHistory() {
    historyBody.replaceChildren();

    const history = getHistory();

    if (history.length === 0) {
      const row = historyBody.insertRow();
      const cell = row.insertCell();

      cell.colSpan = 4;
      cell.textContent = "記録はまだありません";
      return;
    }

    history.slice().reverse().forEach(record => {
      const row = historyBody.insertRow();

      const dateCell = row.insertCell();
      const exerciseCell = row.insertCell();
      const timeCell = row.insertCell();
      const countCell = row.insertCell();

      dateCell.textContent =
        new Date(record.startedAt).toLocaleString("ja-JP");

      exerciseCell.textContent = record.exercise;
      timeCell.textContent =
        formatTime(record.durationMs);

      countCell.textContent = record.count + "回";
    });
  }

  // 練習結果を保存
  function saveTraining() {
    if (trainingRunning ||
        trainingStartedAt === null ||
        lastSaved) {
      return;
    }

    const record = {
      startedAt: trainingStartedAt.toISOString(),
      endedAt: trainingEndedAt.toISOString(),
      exercise: exerciseSelect.value,
      durationMs: Math.round(elapsedMilliseconds),
      count: exerciseCount
    };

    const history = getHistory();
    history.push(record);

    try {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(history)
      );

      lastSaved = true;
      updateTrainingButtons();
      showHistory();

      trainingStatus.textContent =
        "練習結果を保存しました。";

    } catch (error) {
      console.error(error);

      trainingStatus.textContent =
        "保存に失敗しました。保存領域を確認してください。";
    }
  }

  // CSV出力用の文字列を整える
  function csvCell(value) {
    const text = String(value);

    return '"' +
      text.replace(/"/g, '""') +
      '"';
  }

  // Excelで開けるCSVファイルを作成
  function exportCSV() {
    const history = getHistory();

    if (history.length === 0) {
      trainingStatus.textContent =
        "出力する練習履歴がありません。";
      return;
    }

    const rows = [
      ["開始日時", "終了日時",
       "運動メニュー", "練習時間（秒）", "運動回数"]
    ];

    history.forEach(record => {
      rows.push([
        new Date(record.startedAt).toLocaleString("ja-JP"),
        new Date(record.endedAt).toLocaleString("ja-JP"),
        record.exercise,
        Math.round(record.durationMs / 1000),
        record.count
      ]);
    });

    const csv = rows
      .map(row => row.map(csvCell).join(","))
      .join("\r\n");

    // UTF-8 BOMを追加して日本語の文字化けを軽減
    const blob = new Blob(
      ["\uFEFF" + csv],
      { type: "text/csv;charset=utf-8;" }
    );

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.href = url;
    link.download = "ULVT_練習記録.csv";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1000);

    trainingStatus.textContent =
      "CSVファイルを出力しました。";
  }

  // ボタンと機能を接続
  startTrainingButton.addEventListener(
    "click", startTraining
  );

  stopTrainingButton.addEventListener(
    "click", stopTraining
  );

  addCountButton.addEventListener(
    "click", addCount
  );

  subtractCountButton.addEventListener(
    "click", subtractCount
  );

  saveTrainingButton.addEventListener(
    "click", saveTraining
  );

  exportCSVButton.addEventListener(
    "click", exportCSV
  );

  // 初期表示
  updateTimer();
  updateCount();
  updateTrainingButtons();
  showHistory();

  // ページ終了時にタイマーを解除
  window.addEventListener("pagehide", () => {
    clearInterval(timerInterval);
  });
</script>
</body>
</html>
